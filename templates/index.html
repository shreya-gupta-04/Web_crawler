<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Crawler - Search Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="number"],
        input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
            width: 100%;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
            padding: 8px 15px;
            font-size: 0.9em;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-small {
            padding: 8px 15px;
            font-size: 0.85em;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            color: #666;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .search-box {
            margin-bottom: 20px;
        }
        
        .search-input-group {
            display: flex;
            gap: 10px;
        }
        
        .search-input-group input {
            flex: 1;
        }
        
        .search-input-group button {
            padding: 12px 30px;
            width: auto;
        }
        
        .results {
            margin-top: 20px;
        }
        
        .result-item {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        
        .result-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }
        
        .result-title {
            font-size: 1.2em;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        
        .result-url {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 8px;
            word-break: break-all;
        }
        
        .result-text {
            color: #666;
            line-height: 1.5;
            font-size: 0.95em;
        }
        
        .result-score {
            display: inline-block;
            background: #e0e7ff;
            color: #667eea;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.85em;
            margin-top: 8px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #f5c6cb;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #c3e6cb;
        }
        
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #bee5eb;
        }
        
        .no-results {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 1.1em;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
            
            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Web Crawler Search</h1>
            <p class="subtitle">Crawl any website and search its contents</p>
        </header>
        
        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('crawl')">Crawl</button>
                <button class="tab-btn" onclick="switchTab('search')">Search</button>
                <button class="tab-btn" onclick="switchTab('browse')">Browse</button>
            </div>
            
            <!-- Crawl Tab -->
            <div id="crawl" class="tab-content active">
                <h2 style="margin-bottom: 20px;">Start Crawling</h2>
                
                <div id="crawlAlert"></div>
                
                <form id="crawlForm" onsubmit="handleCrawl(event)">
                    <div class="form-group">
                        <label for="url">Website URL *</label>
                        <input 
                            type="url" 
                            id="url" 
                            name="url"
                            placeholder="e.g., quotes.toscrape.com" 
                            required
                        >
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="maxPages">Max Pages to Crawl</label>
                            <input 
                                type="number" 
                                id="maxPages" 
                                name="max_pages"
                                value="50"
                                min="1"
                                max="1000"
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="delay">Delay Between Requests (seconds)</label>
                            <input 
                                type="number" 
                                id="delay" 
                                name="delay"
                                value="2"
                                min="0.5"
                                step="0.5"
                            >
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-primary">Start Crawling</button>
                </form>
                
                <div id="crawlLoading" class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px; color: #666;">Crawling in progress...</p>
                </div>
                
                <div id="crawlStats" style="display: none; margin-top: 30px;">
                    <div class="stats" id="statsBox"></div>
                </div>
            </div>
            
            <!-- Search Tab -->
            <div id="search" class="tab-content">
                <h2 style="margin-bottom: 20px;">Search Results</h2>
                
                <div id="searchAlert"></div>
                
                <div class="search-box">
                    <div class="search-input-group">
                        <input 
                            type="text" 
                            id="searchQuery" 
                            placeholder="Enter search query..."
                            onkeypress="if(event.key === 'Enter') handleSearch()"
                        >
                        <button onclick="handleSearch()" class="btn-primary">Search</button>
                    </div>
                </div>
                
                <div id="searchLoading" class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px; color: #666;">Searching...</p>
                </div>
                
                <div id="searchResults" class="results"></div>
            </div>
            
            <!-- Browse Tab -->
            <div id="browse" class="tab-content">
                <h2 style="margin-bottom: 20px;">Browse Crawled Pages</h2>
                
                <div id="browseAlert"></div>
                
                <button onclick="loadPages()" class="btn-secondary btn-small">Refresh</button>
                <button onclick="handleReset()" class="btn-secondary btn-small" style="background: #dc3545; margin-left: 10px;">Clear All</button>
                
                <div id="browseLoading" class="loading" style="margin-top: 20px;">
                    <div class="spinner"></div>
                </div>
                
                <div id="pagesList" class="results" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>
    
    <script>
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            // Load data if browse tab
            if (tabName === 'browse') {
                loadPages();
            }
        }
        
        function showAlert(elementId, message, type = 'info') {
            const alertEl = document.getElementById(elementId);
            alertEl.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                alertEl.innerHTML = '';
            }, 5000);
        }
        
        async function handleCrawl(event) {
            event.preventDefault();
            
            const url = document.getElementById('url').value.trim();
            const maxPages = document.getElementById('maxPages').value;
            const delay = document.getElementById('delay').value;
            
            document.getElementById('crawlForm').style.display = 'none';
            document.getElementById('crawlLoading').style.display = 'block';
            document.getElementById('crawlStats').style.display = 'none';
            document.getElementById('crawlAlert').innerHTML = '';
            
            try {
                const response = await fetch('/api/crawl', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        max_pages: maxPages,
                        delay: delay
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showAlert('crawlAlert', `✅ ${data.message}`, 'success');
                    loadStats();
                    document.getElementById('crawlStats').style.display = 'block';
                } else {
                    showAlert('crawlAlert', `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showAlert('crawlAlert', `❌ Error: ${error.message}`, 'error');
            } finally {
                document.getElementById('crawlLoading').style.display = 'none';
                document.getElementById('crawlForm').style.display = 'block';
            }
        }
        
        async function handleSearch() {
            const query = document.getElementById('searchQuery').value.trim();
            
            if (!query) {
                showAlert('searchAlert', '⚠️ Please enter a search query', 'info');
                return;
            }
            
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchLoading').style.display = 'block';
            document.getElementById('searchAlert').innerHTML = '';
            
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (response.ok) {
                    displaySearchResults(data.results, query);
                } else {
                    showAlert('searchAlert', `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showAlert('searchAlert', `❌ Error: ${error.message}`, 'error');
            } finally {
                document.getElementById('searchLoading').style.display = 'none';
            }
        }
        
        function displaySearchResults(results, query) {
            const resultsDiv = document.getElementById('searchResults');
            
            if (results.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">No results found for your query</div>';
                return;
            }
            
            resultsDiv.innerHTML = results.map(result => `
                <div class="result-item">
                    <div class="result-title" onclick="window.open('${result.url}', '_blank')">${result.title || 'Untitled'}</div>
                    <div class="result-url">${result.url}</div>
                    <div class="result-text">${getPreview(result)}</div>
                    <span class="result-score">Relevance: ${(result.score * 100).toFixed(1)}%</span>
                </div>
            `).join('');
        }
        
        function getPreview(result) {
            const text = result.text || '';
            if (text.length > 200) {
                return text.substring(0, 200) + '...';
            }
            return text;
        }
        
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                const statsBox = document.getElementById('statsBox');
                statsBox.innerHTML = `
                    <div class="stat-box">
                        <div class="stat-number">${data.total_pages}</div>
                        <div class="stat-label">Pages Crawled</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${data.total_unique_words}</div>
                        <div class="stat-label">Unique Words</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${data.indexed ? '✅' : '❌'}</div>
                        <div class="stat-label">Indexed</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        async function loadPages() {
            document.getElementById('pagesList').innerHTML = '';
            document.getElementById('browseLoading').style.display = 'block';
            
            try {
                const response = await fetch('/api/pages');
                const data = await response.json();
                
                if (response.ok) {
                    displayPages(data.pages);
                } else {
                    showAlert('browseAlert', `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showAlert('browseAlert', `❌ Error: ${error.message}`, 'error');
            } finally {
                document.getElementById('browseLoading').style.display = 'none';
            }
        }
        
        function displayPages(pages) {
            const pagesList = document.getElementById('pagesList');
            
            if (pages.length === 0) {
                pagesList.innerHTML = '<div class="no-results">No pages crawled yet. Start crawling to see results!</div>';
                return;
            }
            
            pagesList.innerHTML = pages.map(page => `
                <div class="result-item">
                    <div class="result-title" onclick="window.open('${page.url}', '_blank')">${page.title || 'Untitled'}</div>
                    <div class="result-url">${page.url}</div>
                    <div class="result-text">${getPreview(page)}</div>
                </div>
            `).join('');
        }
        
        async function handleReset() {
            if (!confirm('Are you sure you want to clear all data? This cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch('/api/reset', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (response.ok) {
                    showAlert('browseAlert', '✅ All data cleared', 'success');
                    document.getElementById('pagesList').innerHTML = '';
                    document.getElementById('searchResults').innerHTML = '';
                } else {
                    showAlert('browseAlert', `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showAlert('browseAlert', `❌ Error: ${error.message}`, 'error');
            }
        }
        
        // Initial load
        window.onload = function() {
            loadStats();
        };
    </script>
</body>
</html>
